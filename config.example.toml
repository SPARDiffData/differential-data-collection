# diffdata configuration.
# Copy this file to config.toml in a .diffdata folder in your home folder
# (C:\Users\<you>\.diffdata\config.toml on Windows, ~/.diffdata/config.toml on a Mac)
# and fill in your own values. Outside the repo, tools working in it can't read it.
# A config.toml in the repo folder also works; it's gitignored. Never commit it.

[sources]
# CON-1: listing a channel or folder here is your opt-in to collecting it.
# Remove it and collection stops on the next run (CON-3).
slack_channels = ["example-channel"]  # channel names, without the '#'
slack_workspace_url = "https://example.slack.com"  # your workspace's address, for message links
slack_canvases = []                   # canvas IDs ("F...") or canvas links; read when they may have changed
canvas_refresh_days = 7               # read each listed canvas at least this often, changed or not
folders = []                          # fixed places to check, e.g. ["~/Documents/transcripts"]

[local]
# Where collected data is kept on your computer.
# HARD RULE: real collected data never goes in a git commit. This folder must be
# outside any git repository; diffdata refuses to use a folder inside one.
data_dir = "~/diffdata-data"

[store]
# STO-1: the pilot store is the SPARDiffData shared Google Drive.
backend = "google-drive"
folder = ""  # the shared Drive folder to push to
