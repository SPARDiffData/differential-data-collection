# diffdata configuration.
# The easy way: run `uv run diffdata setup` in your own terminal. It writes this file for you.
# To do it by hand instead:
# Copy this file to config.toml in a .diffdata folder in your home folder
# (C:\Users\<you>\.diffdata\config.toml on Windows, ~/.diffdata/config.toml on a Mac)
# and fill in your own values. Outside the repo, tools working in it can't read it.
# A config.toml in the repo folder also works; it's gitignored. Never commit it.

[sources]
# CON-1: listing a channel or folder here is your opt-in to collecting it.
# Remove it and collection stops on the next run (CON-3).
slack_channels = ["example-channel"]  # channel names without the '#', IDs ("C...") or channel links
slack_workspace_url = "https://example.slack.com"  # your workspace's address, for message links
slack_canvases = []                   # canvas IDs ("F...") or canvas links; read when they may have changed
# CON-4, CON-5: Slack user IDs ("U...") of people who opted out of this channel. Their
# messages are left out of everything diffdata builds. They're real IDs, so keep them here,
# never in the repo. With a team folder under [store], the export also fetches your team's
# list from the store once the 7 days are over, and adds it to these (it never drops anyone).
slack_opted_out = []
# CON-5: the link to each channel's pinned notice (Copy link on the notice itself, not a reply
# to it). Anyone whose latest join of a channel is after its notice is left out of that
# channel, like someone in slack_opted_out: they never got the notice or its 7 days. Every
# channel you export needs an entry. Write "none" for a channel with no notice, such as one
# where everyone agreed directly, and the build will say it wasn't checked.
# Key an entry by the channel's name, or by its ID if slack_channels lists it by ID.
slack_notices = { "example-channel" = "none" }
# Canvases and Google files found in your Slack data are approved or skipped in your own
# terminal with `uv run diffdata consent review`, and withdrawn with
# `uv run diffdata consent withdraw`. Those decisions go in approvals.jsonl, next to this file.
canvas_refresh_days = 7               # read each listed canvas at least this often, changed or not
# A Google Doc is fetched only if it's listed here and you picked it at sign-in
# (uv run diffdata collect google-docs sign-in). Remove it and collection stops on the next run.
google_docs = []                      # Google Doc IDs or links
folders = []                          # fixed places to check, e.g. ["~/Documents/transcripts"]

[local]
# Where collected data is kept on your computer.
# HARD RULE: real collected data never goes in a git commit. This folder must be
# outside any git repository; diffdata refuses to use a folder inside one.
data_dir = "~/diffdata-data"

[store]
# STO-1: the pilot store is a Google Cloud Storage bucket (decision D3 in the Second
# Half Plan). `uv run diffdata push` sends your scrubbed copies there, and refuses to run
# until every setting below is filled in. The project team gives your team this whole block
# except producer, and a key, all in one team file: `uv run diffdata setup <team file>` puts
# the key next to this file as store-key.json. It can only add files to your team's
# folder. Never share it or open it in an AI tool.
backend = "gcs"
bucket = ""    # the bucket's name, from the project team
folder = ""    # your team's folder in the bucket, from the project team
producer = ""  # a pseudonym that labels your copies in the shared store instead of your name; never your real name
project = ""   # your project's short name, from the project team
# Copies are marked not approved for release: names of people who aren't in the people list
# aren't checked yet. "yes" sends them anyway, to a part of the folder consumers never get.
send_not_approved = "no"
# folder, producer and project are plain names: letters, digits, - and _ only.
