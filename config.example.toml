# diffdata configuration.
# Copy this file to config.toml in a .diffdata folder in your home folder
# (C:\Users\<you>\.diffdata\config.toml on Windows, ~/.diffdata/config.toml on a Mac)
# and fill in your own values. Outside the repo, tools working in it can't read it.
# A config.toml in the repo folder also works; it's gitignored. Never commit it.

[sources]
# CON-1: listing a channel or folder here is your opt-in to collecting it.
# Remove it and collection stops on the next run (CON-3).
slack_channels = ["example-channel"]  # channel names, without the '#'
slack_workspace_url = "https://example.slack.com"  # your workspace's address, for message links
slack_canvases = []                   # canvas IDs ("F...") or canvas links; read when they may have changed
# CON-4, CON-5: Slack user IDs ("U...") of people who opted out of this channel. The project
# team sends you these lines when the 7-day opt-out window closes. Their messages are left
# out of everything diffdata builds. They're real IDs, so keep them here, never in the repo.
slack_opted_out = []
# Canvases and Google files found in your Slack data are approved or skipped in your own
# terminal with `uv run diffdata consent review`, and withdrawn with
# `uv run diffdata consent withdraw`. Those decisions go in approvals.jsonl, next to this file.
canvas_refresh_days = 7               # read each listed canvas at least this often, changed or not
# A Google Doc is fetched only if it's listed here and you picked it at sign-in
# (uv run diffdata collect google-docs sign-in). Remove it and collection stops on the next run.
google_docs = []                      # Google Doc IDs or links
folders = []                          # fixed places to check, e.g. ["~/Documents/transcripts"]

[local]
# Where collected data is kept on your computer.
# HARD RULE: real collected data never goes in a git commit. This folder must be
# outside any git repository; diffdata refuses to use a folder inside one.
data_dir = "~/diffdata-data"

[store]
# STO-1: the pilot store is a Google Cloud Storage bucket (decision D3 in the Second
# Half Plan). `uv run diffdata push` sends your scrubbed copies there, and refuses to run
# until every setting below is filled in. Sign in once first, with the Google account the
# project team gave access to: gcloud auth application-default login
backend = "gcs"
bucket = ""    # the bucket's name, from the project team
folder = ""    # your team's folder in the bucket, from the project team
producer = ""  # a short handle for you, like "team-a-1": not your full name
project = ""   # your project's short name, like "diffdata"
# folder, producer and project are plain names: letters, digits, - and _ only.
